# Zwei Environments, ein Code- und ein Schemastand.
#
# Der Worker wird immer mit --env aufgerufen, es gibt bewusst keine
# Standard-Umgebung: So kann ein Deploy nicht versehentlich ohne
# Datenbankbindung oder gegen die falsche Datenbank laufen.
#
# Die database_id-Werte stammen aus `wrangler d1 create` und sind keine
# Secrets – sie identifizieren die Datenbank nur innerhalb des Kontos.

name = "ddm-leads"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Beobachtbarkeit für `wrangler tail`. Geloggt wird im Worker
# ausschließlich die Fehlermeldung plus Lead-ID, nie ein Payload.
[observability]
enabled = true

# ─── Preview ──────────────────────────────────────────────────────────
[env.preview]
name = "ddm-leads-preview"

[env.preview.vars]
# Empfaenger der Benachrichtigung, kommagetrennt. Zwei Adressen mit Absicht:
# info@ ist ein Catch-all mit Spamfilter, li.liu@ ist die Rueckfallebene,
# falls der Filter ausgerechnet diese Meldung aussortiert.
NOTIFY_TO = "info@datadrivenmarketing.de,li.liu@datadrivenmarketing.de"
# Absender. Die Domain ist bei Mailjet verifiziert; ein echtes Postfach
# muss dahinter nicht stehen.
NOTIFY_FROM = "formular@datadrivenmarketing.de"
# Steht als Link in jeder Benachrichtigung.
ADMIN_URL = "https://ddm-leads-preview.datadrivenmarketing.workers.dev/admin"

# Keine Secrets hier. MAILJET_API_KEY, MAILJET_SECRET_KEY, ADMIN_USER und
# ADMIN_PASSWORD kommen ueber `wrangler secret put`.

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ddm-leads-preview"
database_id = "b43c2fb9-7d56-48aa-8c15-d94baa1cc3d0"

# ─── Production ───────────────────────────────────────────────────────
[env.production]
name = "ddm-leads-prod"

[env.production.vars]
# Empfaenger der Benachrichtigung, kommagetrennt. Zwei Adressen mit Absicht:
# info@ ist ein Catch-all mit Spamfilter, li.liu@ ist die Rueckfallebene,
# falls der Filter ausgerechnet diese Meldung aussortiert.
NOTIFY_TO = "info@datadrivenmarketing.de,li.liu@datadrivenmarketing.de"
# Absender. Die Domain ist bei Mailjet verifiziert; ein echtes Postfach
# muss dahinter nicht stehen.
NOTIFY_FROM = "formular@datadrivenmarketing.de"
# Steht als Link in jeder Benachrichtigung.
ADMIN_URL = "https://ddm-leads-prod.datadrivenmarketing.workers.dev/admin"

# Keine Secrets hier. MAILJET_API_KEY, MAILJET_SECRET_KEY, ADMIN_USER und
# ADMIN_PASSWORD kommen ueber `wrangler secret put`.

[[env.production.d1_databases]]
binding = "DB"
database_name = "ddm-leads-prod"
database_id = "126b8454-ae45-4f9f-9edc-93ed1dd8e9a7"
